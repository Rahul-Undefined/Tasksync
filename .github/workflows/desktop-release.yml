# Builds the Windows app and publishes it as a GitHub release. Installed copies of TaskSync
# check the TaskSync server (/api/desktop/latest) and update themselves to the newest release.
#
# Release a new version:  git tag desktop-v0.2.0 && git push origin desktop-v0.2.0
name: Desktop release

on:
  push:
    tags: ['desktop-v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        id: v
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^desktop-v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like desktop-v1.2.3" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test desktop/TaskSync.Desktop.Tests -c Release

      - name: Publish
        run: >
          dotnet publish desktop/TaskSync.Desktop -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ steps.v.outputs.version }} -o out/TaskSync

      - name: Package
        shell: pwsh
        run: |
          Remove-Item out/TaskSync/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out/TaskSync/* -DestinationPath TaskSync-win-x64.zip
          (Get-FileHash TaskSync-win-x64.zip -Algorithm SHA256).Hash.ToLower() | Out-File TaskSync-win-x64.zip.sha256 -Encoding ascii

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >
          gh release create '${{ github.ref_name }}' TaskSync-win-x64.zip TaskSync-win-x64.zip.sha256
          --title 'TaskSync for Windows ${{ steps.v.outputs.version }}'
          --notes 'Unzip and run TaskSync.exe (needs the .NET 8 Desktop Runtime). Installed copies update themselves automatically.'
