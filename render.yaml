# Render Blueprint for TaskSync (free tier). See DEPLOYMENT_GUIDE.md.
# The existing service tasksync-vgam uses Render's Docker runtime and builds ./Dockerfile.
# You can configure that service by hand (recommended, keeps the URL) or link this Blueprint to it.
services:
  - type: web
    name: tasksync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_EMAIL_DOMAINS
        value: myomnifi.com
      - key: PUBLIC_BASE_URL
        value: https://tasksync-vgam.onrender.com
      # Secrets / tenant-specific values: set in the Render dashboard (never commit them).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
