# Render Blueprint for TaskSync (free tier). See DEPLOYMENT_GUIDE.md.
# The existing service tasksync-vgam uses Render's Docker runtime and builds ./Dockerfile.
# You can configure that service by hand (recommended, keeps the URL) or link this Blueprint to it.
services:
  - type: web
    name: tasksync
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ALLOWED_EMAIL_DOMAINS
        value: myomnifi.com
      # Set in the Render dashboard (never commit them). Tenant ID and site URL are automatic.
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
